<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe</title>
    <base href="../">
    <link rel="stylesheet" href="public/style/general.css">
    <link rel="stylesheet" href="public/style/components/import.css">
    <link rel="stylesheet" href="public/style/pages/equipe.css">
</head>
<body>
<main class="corpo">
    <div class="perfil-banner">
    <div class="banner">
        <img src="public/assets/img/placeholder/BannerEquipe.jpeg" alt="Banner">
    </div>

    <div class="perfil">
        <div class="perfil-esquerdo">
            <div class="perfil-foto">
                <img src="public/assets/img/placeholder/PerfilEquipe.jpeg" alt="Perfil">
            </div>
        </div>
        <div class="perfil">
            <div class="perfil-esquerdo">
                <div class="perfil-foto">
                    <img src="public/assets/img/placeholder/PerfilEquipe.jpeg" alt="Perfil">
                </div>
                <span class="equipe-nome">Equipe legal do 3Ds</span>
                <button class="botão">+</button>
            </div>
            
            <div class="icones-das-bolas">
                <img src="public/assets/img/Bolas.png" alt="Myballs">
            </div>
        </div>
    </div>
</div>

<div class="corpo-baixo">
    <div class="esquerdo">
        <div class="equipe-bio">
            <p>Formado:</p>
            <p>fevereiro 2023</p>
        </div>
        <p>Administração</p>
        <div class="Admin-equipe">
            <img src="public/assets/img/placeholder/PerfilPessoa.jpg" alt="Duda">
            <div>
                <p>Eduarda Leal</p>
                <p>3ºDS</p>
                <p>Capitã</p>
            </div>
            <div class="Admin-Info">
            <span>100</span>
            <span class="seta">></span>
            </div>
        </div>
    </div>

    <div class="meio">
        <p>Participantes <span>partidas recentes</span></p>
        <div class="ProPlayers">
            <img src="public/assets/img/placeholder/PerfilPessoa.jpg" alt="Dudadnv">
            <div class="ProPlayer-coisas">
                <p>Eduarda Leal</p>
                <span>3DS</span>
                <button class="botão">+</button>
            </div>
            <div class="conquistas">
                <span>100</span>
                <img src="public/assets/img/placeholder/ConquistaUM.jpg" alt="Conquista 1">
                <img src="public/assets/img/placeholder/ConquistaDOIS.jpg" alt="Conquista 2">
                <span class="seta">></span>
            </div>
        </div>
        </div>

    <div class="direito">
        <p>Campeonatos ganhos:</p>
        <div class="Campeonatos">
            <div class="campeonato-info">
                <p>Interclasse 2026</p>
                <p>27-07-2026</p>
            </div>
            <span class="seta">></span>
        </div>
    </div>
</div>
        
</div>
</main>

    
</body>
</html>
