<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <base href="../">
    <link rel="stylesheet" href="public/style/general.css">
    <link rel="stylesheet" href="public/style/components/import.css">
    <link rel="stylesheet" href="public/style/pages/perfil.css">
</head>
<body class="main-color">
    <header>
        <div class="navbar default">
            <div class="navbar-gradient"></div>
            <div class="navbar-logo">
                Interclasse
            </div>
            <ul class="navbar-nav central">
                <li class="nav-item">
                    <a class="nav-link" href="?">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="?">Times</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="?">Ranking</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="?">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-button" href="?">Cadastro</a>
                </li>
            </ul>
        </div>
    </header>
    

    <main class="corpo">

    <div class="perfil-banner">
    <div class="banner">
        <img src="public/assets/img/placeholder/BannerEquipe.jpeg" alt="Banner">
    </div>
        <div class="perfil">
            <div class="perfil-esquerdo">
                <div class="perfil-foto">
                    <img src="public/assets/img/placeholder/PerfilEquipe.jpeg" alt="Perfil">
                </div>
                <div class="hexagono-nivel-borda">
                    <div class="hexagono-nivel">100</div>
                </div>
                <div class="progresso">
                    <div class="barra-progresso"></div>
                    <span class="porcentagem-progresso">100%</span>
                </div>
                <button class="botão">+</button>
            </div>
            
            <div class="icones-das-bolas">
                <img src="public/assets/img/Bolas.png" alt="Myballs">
            </div>
        </div>
    </div>
</div>


<div class="corpo-baixo">

    <div class="esquerdo">
        <div class="equipe-bio">
            <p>Formado:</p>
            <p>fevereiro 2023</p>
        </div>
        <br>
        <p>Administração</p>
        <div class="Admin-equipe">
            <img src="public/assets/img/placeholder/PerfilPessoa.jpg" alt="Duda">
            <div>
                <p>Eduarda Leal</p>
                <p>3ºDS</p>
                <p>Capitã</p>
            </div>
            <div class="Admin-Info">
            <span>100</span>
            <span class="seta">></span>
            </div>
        </div>
    </div>


    <div class="meio">
        <p>Participantes - <span>jogadores do 3ºDS</span></p>
        <div class="ProPlayers">
            <div class="jogador-esquerdo">
                <img src="public/assets/img/placeholder/PerfilPessoa.jpg" alt="Dudadnv">
            <div class="jogador-dados">
                <p>Eduarda Leal</p>
                <div class="jogador-curso">
                    <span>3DS</span>
                    <button class="botão">+</button>
                </div>
            </div>
        </div>
        <div class="nivel">
             100
         </div>
        <div class="jogador-conquistas">
            <img src="public/assets/img/placeholder/ConquistaUM.jpg" alt="Conquista 1">
            <img src="public/assets/img/placeholder/ConquistaDOIS.jpg" alt="Conquista 2">
        </div>
        <span class="seta">></span>
        </div>
    </div>

        

    <div class="direito">
        <p>Campeonatos ganhos:</p>
        <div class="Campeonatos">
            <div class="campeonato-info">
                <p>Interclasse 2026</p>
                <p>27-07-2026</p>
            </div>
            <div class="seta"></div>
            <span >></span>
            </div>
        </div>
    </div>
</div>
        
</div>
